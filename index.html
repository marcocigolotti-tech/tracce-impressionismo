<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>Tracce di Impressionismo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Tracce di Impressionismo</h1>
      <p>Osserva. Cerca gli indizi. Sostieni la tua interpretazione.</p>
    </div>
    <button id="zoomBtn" class="btn btn-light hidden" type="button">🔍 Ingrandisci opera</button>
  </header>
  <nav id="progress" class="progress hidden" aria-label="Avanzamento"></nav>
  <main id="app" tabindex="-1"></main>
  <footer>Attività didattica ideata dal Prof. Marco Cigolotti</footer>

  <dialog id="helpDialog" class="dialog">
    <div class="dialog-head"><h2 id="helpTitle">Aiuto</h2><button id="helpClose" class="icon-btn" aria-label="Chiudi">✕</button></div>
    <div id="helpBody"></div>
  </dialog>

  <dialog id="zoomDialog" class="zoom-dialog">
    <div class="zoom-head"><button id="zoomClose" class="btn btn-light">✕ Torna all'attività</button></div>
    <div id="zoomStage" class="zoom-stage">
      <img id="zoomImage" alt="">
    </div>
    <p class="zoom-tip">Usa due dita sul tablet per ingrandire e spostare l'immagine.</p>
  </dialog>

  <script src="js/cases.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
